
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
       <div id="output"></div>
    <script>
        function hinhTron(banKinh) {
    const pi = Math.PI;
    let chuVi = (2 * pi * banKinh).toFixed(2);
    let dienTich = (pi * Math.pow(banKinh, 2)).toFixed(2);
    document.getElementById('output').innerHTML=`
    <p>Chu Vi: ${chuVi}</p>
    <p>Dien tich: ${dienTich}</p>
    `;
        }
hinhTron(7);
       
    </script>
</body>
</html>
